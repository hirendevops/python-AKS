name: 'Build & Push Docker Image'
description: 'Builds and pushes Docker image to ACR'
inputs:
  service-name:
    description: 'Name of the service (folder name)'
    required: true
  registry-name:
    description: 'Name of the ACR registry'
    required: true
  registry-username:
    description: 'Username for ACR'
    required: true
  registry-password:
    description: 'Password for ACR'
    required: true
  dockerfile-path:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to ACR
      uses: docker/login-action@v2
      with:
        registry: ${{ inputs.registry-name }}.azurecr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
        
    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./${{ inputs.service-name }}
        file: ./${{ inputs.service-name }}/${{ inputs.dockerfile-path }}
        push: true
        tags: ${{ inputs.registry-name }}.azurecr.io/${{ inputs.service-name }}:${{ github.sha }}
